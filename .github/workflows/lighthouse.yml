name: Lighthouse

on:
  workflow_dispatch:
  push:

concurrency: lighthouse

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run generate
      - name: Symlinks
        # Content-Static-Dateien (Bilder etc.) aus dem Submodule in die generierte Site MERGEN.
        # Wichtig: nicht loeschen/ersetzen — .output/public/blog/<slug>/index.html usw. sind die
        # von Nuxt vorgerenderten Routen und duerfen nicht verloren gehen.
        run: |
          rsync -r --exclude='*.html' --exclude='_payload.json' ./cms-content/static/ ./.output/public/
          cp -r ./cms-content/static/old/. ./.output/public/old/

      - name: Setup deploy
        run: |
          echo "${{secrets.DEPLOY_KEY}}" > deploy_key
          chmod 600 ./deploy_key

      - name: Deploy to lighthouse.ec-nordbund.de
        run: |
          rsync -chrvz --stats --delete \
            -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
            ./.output/public/ deployer@ec-nordbund.de:/webpage/lighthouse.ec-nordbund.de

      - name: Lighthouse Audits
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{secrets.LHCI_GITHUB_APP_TOKEN}}
          LHCI_TOKEN: ${{secrets.LHCI_TOKEN}}
          CI: true
